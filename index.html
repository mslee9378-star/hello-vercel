<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘 할일 · 미래의 나를 위한 투자</title>

<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="오늘 할일">


<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>✅</text></svg>">

<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="topbar">
  <span class="spacer"></span>
  <span class="brand">오늘 할일</span>
  <a class="iconbtn" href="month.html" aria-label="월간 달력">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
  </a>
</header>

<main class="page">
  <p class="kicker">오늘</p>
  <h1 class="display" id="dateline"></h1>
  <p class="brandsub">미래의 나를 위한 투자</p>

  <!-- 오늘의 진척도 -->
  <section class="hero" aria-labelledby="scoreCap">
    <div class="herotop">
      <span class="hlabel" id="scoreCap">오늘의 진척도</span>
      <span class="hval" id="pct">0%</span>
    </div>
    <div class="hbar" id="ring"><i></i></div>
    <div class="moodrow">
      <p class="mood" id="mood"></p>
      <span class="streak" id="streak" hidden></span>
    </div>
    <div class="statline">
      <div><div class="n" id="nDone">0</div><div class="t">해낸 일</div></div>
      <div><div class="n" id="nMiss">0</div><div class="t">남은 일</div></div>
      <div><div class="n bad" id="nBad">0</div><div class="t">어긴 일</div></div>
    </div>
  </section>

  <!-- 체크리스트 3그룹 (app.js가 생성) -->
  <div id="list"></div>

  <!-- 오늘의 기억 (app.js가 생성) -->
  <div id="memoslot"></div>

  <!-- 기록 백업 (app.js가 생성) -->
  <div id="backupslot"></div>
</main>

<nav class="tabbar" aria-label="주요 화면">
  <a href="index.html" aria-current="page">
    <svg viewBox="0 0 24 24"><path d="M4.5 12.5l2.5 2.5 4.5-5.5"/><path d="M4.5 6.5h15M9 12.5h10.5M4.5 18.5h15"/></svg>
    오늘
  </a>
  <a href="week.html">
    <svg viewBox="0 0 24 24"><path d="M4 19V9M9.3 19V5M14.7 19v-7M20 19v-4"/></svg>
    주간
  </a>
  <a href="month.html">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
    월간
  </a>
</nav>

<script src="app.js"></script>
<script>
(function () {
  var today = App.today();

  var ringEl = document.getElementById('ring');
  var pctEl = document.getElementById('pct');
  var nDone = document.getElementById('nDone');
  var nMiss = document.getElementById('nMiss');
  var nBad = document.getElementById('nBad');
  var moodEl = document.getElementById('mood');
  var streakEl = document.getElementById('streak');

  // 연도는 빼고 담백하게
  document.getElementById('dateline').textContent =
    (today.getMonth() + 1) + '월 ' + today.getDate() + '일 ' + App.DOW[today.getDay()] + '요일';

  function refresh() {
    var s = App.stats(today);
    ringEl.style.setProperty('--p', s.pct);
    ringEl.classList.toggle('hasbad', s.violated.length > 0);
    pctEl.textContent = App.pctText(s.pct);
    App.paintMood(moodEl, s.recorded ? App.tier(s.pct) : null, '아직 체크한 것이 없습니다');

    // 하루짜리는 연속이 아니므로 이틀부터 보여 줍니다
    var run = App.streak();
    streakEl.hidden = run < 2;
    streakEl.textContent = '초록불 ' + run + '일 연속';
    nDone.textContent = s.done.length;
    nMiss.textContent = s.missed.length;
    nBad.textContent = s.violated.length;
  }

  var list = App.makeChecklist(document.getElementById('list'), refresh);
  var memo = App.makeMemo(document.getElementById('memoslot'), '오늘의 기억');

  /* 들여오기로 오늘 기록이 바뀌었을 수 있으니 화면을 다시 그립니다. */
  App.makeBackup(document.getElementById('backupslot'), function () {
    list.load(today);
    memo.load(today);
    refresh();
  });

  list.load(today);
  memo.load(today);
  refresh();

  /* 탭을 켜둔 채 자정을 넘기면 '오늘'이 어제에 멈춰 있습니다. */
  setInterval(function () {
    var now = App.today();
    if (+now === +today) return;
    location.reload();
  }, 60000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && +App.today() !== +today) location.reload();
  });
})();
</script>
</body>
</html>
