<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘 할일 · 미래를 위한 투자</title>

<meta name="theme-color" content="#fcf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="오늘 할일">


<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>✅</text></svg>">

<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="topbar">
  <span class="spacer"></span>
  <span class="brand">오늘 할일</span>
  <a class="iconbtn" href="month.html" aria-label="월간 달력">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
  </a>
</header>

<main class="page">
  <h1 class="brandtitle">오늘 할일</h1>
  <p class="brandsub">미래를 위한 투자</p>
  <p class="dateline" id="dateline"></p>

  <!-- 오늘의 진척도 -->
  <section class="card scorecard" aria-labelledby="scoreCap" style="margin-top:2rem">
    <div class="ringbig" id="ring">
      <span class="val" id="pct">0%</span>
      <span class="cap" id="scoreCap">오늘의 진척도</span>
    </div>
    <div class="statline">
      <div><div class="n" id="nDone">0</div><div class="t">해낸 일</div></div>
      <div><div class="n" id="nMiss">0</div><div class="t">남은 일</div></div>
      <div><div class="n bad" id="nBad">0</div><div class="t">어긴 일</div></div>
    </div>
  </section>

  <!-- 체크리스트 3그룹 (app.js가 생성) -->
  <div id="list"></div>

  <!-- 기타 메모 -->
  <section class="card memowrap" style="margin-top:2rem">
    <div class="memohead">
      <label for="memo">오늘의 기억</label>
      <span class="memostate" id="memostate" aria-live="polite"></span>
    </div>
    <textarea id="memo" class="memo" rows="3" placeholder="남겨 두고 싶은 것이 있다면…"></textarea>
  </section>

  <p class="note">체크와 메모는 이 기기의 브라우저에 저장됩니다.</p>
</main>

<nav class="tabbar" aria-label="주요 화면">
  <a href="index.html" aria-current="page">
    <svg viewBox="0 0 24 24"><path d="M4.5 12.5l2.5 2.5 4.5-5.5"/><path d="M4.5 6.5h15M9 12.5h10.5M4.5 18.5h15"/></svg>
    오늘
  </a>
  <a href="week.html">
    <svg viewBox="0 0 24 24"><path d="M4 19V9M9.3 19V5M14.7 19v-7M20 19v-4"/></svg>
    주간
  </a>
  <a href="month.html">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
    월간
  </a>
</nav>

<script src="app.js"></script>
<script>
(function () {
  var today = App.today();

  var ringEl = document.getElementById('ring');
  var pctEl = document.getElementById('pct');
  var nDone = document.getElementById('nDone');
  var nMiss = document.getElementById('nMiss');
  var nBad = document.getElementById('nBad');

  // 연도는 빼고 담백하게
  document.getElementById('dateline').textContent =
    (today.getMonth() + 1) + '월 ' + today.getDate() + '일 ' + App.DOW[today.getDay()] + '요일';

  function refresh() {
    var s = App.stats(today);
    ringEl.style.setProperty('--p', s.pct);
    pctEl.textContent = App.pctText(s.pct);
    nDone.textContent = s.done.length;
    nMiss.textContent = s.missed.length;
    nBad.textContent = s.violated.length;
  }

  var list = App.makeChecklist(document.getElementById('list'), refresh);
  var memo = App.bindMemo(document.getElementById('memo'), document.getElementById('memostate'));

  list.load(today);
  memo.load(today);
  refresh();

  /* 탭을 켜둔 채 자정을 넘기면 '오늘'이 어제에 멈춰 있습니다. */
  setInterval(function () {
    var now = App.today();
    if (+now === +today) return;
    location.reload();
  }, 60000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && +App.today() !== +today) location.reload();
  });
})();
</script>
</body>
</html>
